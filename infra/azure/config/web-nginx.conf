# nginx configuration for the web app on Azure Container Apps. It is mounted over the image's
# /etc/nginx/conf.d/default.conf (see modules/apps.bicep), so src/web stays unchanged.
#
# It differs from src/web/nginx.conf in one way: inside a Container Apps environment another app is
# reached over HTTPS on its own host name, and the environment routes by Host header, so the proxy
# must send the API's host name rather than the web app's. __API_HOST__ is filled in at deployment.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard calls the CareLoop API on its own origin; forward /api/ to the api app.
    location /api/ {
        proxy_pass https://__API_HOST__/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host __API_HOST__;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # An AI handoff draft can take longer than nginx's 60 second default.
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
