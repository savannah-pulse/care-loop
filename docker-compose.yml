services:
  api:
    build:
      context: .
      dockerfile: src/api/CareLoop.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"

  web:
    build:
      context: src/web
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "4173:80"
