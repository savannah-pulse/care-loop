services:
  api:
    build:
      context: .
      dockerfile: src/api/CareLoop.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Local demo only: throwaway SQLite file and a synthetic queue; the real database and routing are team decisions.
      ConnectionStrings__CareLoop: Data Source=/tmp/careloop.db
      CareLoop__Database__EnsureCreated: "true"
      CareLoop__OwnerAssignment__DefaultQueueId: synthetic-facility-lead-queue
    ports:
      - "8080:8080"

  web:
    build:
      context: src/web
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "4173:80"

  ai-workflow:
    build:
      context: src/ai_workflow
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
