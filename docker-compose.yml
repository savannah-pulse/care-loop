# CareLoop local stack: database, API, web, AI workflow service and both simulators.
# It runs on the simulators and synthetic data only. Build context is the repository root so the
# shared Directory.Build.props, global.json and src/simulators/scenarios are available to each image.
# Copy .env.example to .env to change ports or turn the AI provider on.
name: careloop

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careloop}
      POSTGRES_USER: ${POSTGRES_USER:-careloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - careloop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careloop} -d ${POSTGRES_DB:-careloop}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/api/CareLoop.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CareLoop: Host=db;Port=5432;Database=${POSTGRES_DB:-careloop};Username=${POSTGRES_USER:-careloop};Password=${POSTGRES_PASSWORD:-change-me-local-only}
      Database__MigrateOnStartup: "true"
      Pathways__Directory: Infrastructure/Pathways/demo
      # The demo pathway's deadlines last seconds, so the sweep must run about once a second.
      DeadlineWorker__Interval: "00:00:01"
      ExternalSystems__Systems__his-simulator__BaseUrl: http://his-simulator:8080
      # Patients, caregivers and staff are reached by text message and email only. Both channels go to the
      # Messaging simulator (the messaging-simulator service), which calls back signed with the secret.
      Notifications__Sms__BaseUrl: http://messaging-simulator:8080
      Notifications__Sms__InboundSecret: ${SIMULATOR_INBOUND_SECRET:-}
      Notifications__Email__BaseUrl: http://messaging-simulator:8080
      Notifications__Email__InboundSecret: ${SIMULATOR_INBOUND_SECRET:-}
      # Messages give local dates and times, and name the facility in staff notices.
      Notifications__TimeZone: Asia/Dubai
      Notifications__FacilityNames__family-health-centre: Family Health Centre
      Notifications__FacilityNames__general-hospital: General Hospital
      Notifications__FacilityNames__regional-hospital: Regional Hospital
      # Where each staff role is notified. Synthetic addresses, one per role.
      Notifications__StaffContacts__nurse-navigator__Channel: Email
      Notifications__StaffContacts__nurse-navigator__Address: SYN-EMAIL-NURSE-NAVIGATORS
      Notifications__StaffContacts__clinician__Channel: Email
      Notifications__StaffContacts__clinician__Address: SYN-EMAIL-CLINICIANS
      Notifications__StaffContacts__receiving-clinician__Channel: Email
      Notifications__StaffContacts__receiving-clinician__Address: SYN-EMAIL-RECEIVING-CLINICIANS
      Notifications__StaffContacts__lab__Channel: Email
      Notifications__StaffContacts__lab__Address: SYN-EMAIL-LAB
      Notifications__StaffContacts__facility-lead__Channel: Email
      Notifications__StaffContacts__facility-lead__Address: SYN-EMAIL-FACILITY-LEADS
      Notifications__StaffContacts__coordinator__Channel: Email
      Notifications__StaffContacts__coordinator__Address: SYN-EMAIL-COORDINATORS
      Ai__Provider: ${AI_PROVIDER:-NoOp}
      Ai__AzureOpenAi__Endpoint: ${AZURE_OPENAI_ENDPOINT:-}
      Ai__AzureOpenAi__Deployment: ${AZURE_OPENAI_DEPLOYMENT:-}
      Ai__AzureOpenAi__ApiKey: ${AZURE_OPENAI_API_KEY:-}
      # Foundry agents on the dashboard: off unless AI_AGENTS_ENABLED is true. The API calls them with its own Entra
      # identity (DefaultAzureCredential), which needs Azure AI User on the project; no key or token is set here.
      Ai__Agents__Enabled: ${AI_AGENTS_ENABLED:-false}
      Ai__Agents__ProjectEndpoint: ${AI_AGENTS_PROJECT_ENDPOINT:-}
      Ai__Agents__RoleBriefing: ${AI_AGENTS_ROLE_BRIEFING:-role-briefing}
      Ai__Agents__ImpactSummary: ${AI_AGENTS_IMPACT_SUMMARY:-impact-summary}
      Ai__Agents__PatientNotification: ${AI_AGENTS_PATIENT_NOTIFICATION:-patient-notification}
      Ai__Agents__TimeoutSeconds: ${AI_AGENTS_TIMEOUT_SECONDS:-30}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: src/web
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4173}:80"

  ai-workflow:
    build:
      context: src/ai_workflow
      dockerfile: Dockerfile
    environment:
      CARELOOP_AI_PROVIDER: ${CARELOOP_AI_PROVIDER:-disabled}
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT:-}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME:-}
      CARELOOP_AZURE_HOSTED: ${CARELOOP_AZURE_HOSTED:-false}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      CARELOOP_FOUNDRY_PROMPT_SHIELDS_ATTESTED: ${CARELOOP_FOUNDRY_PROMPT_SHIELDS_ATTESTED:-false}
      CARELOOP_AI_MAX_INPUT_BYTES: ${CARELOOP_AI_MAX_INPUT_BYTES:-262144}
      CARELOOP_AI_TIMEOUT_SECONDS: ${CARELOOP_AI_TIMEOUT_SECONDS:-45}
      CARELOOP_AI_PROMPT_VERSION: ${CARELOOP_AI_PROMPT_VERSION:-careloop-ai-v1}
    ports:
      - "${AI_WORKFLOW_PORT:-8081}:8080"

  his-simulator:
    build:
      context: .
      dockerfile: src/simulators/his/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      CareLoop__FhirBaseUrl: http://api:8080/fhir
      # How every simulated patient is reached: sms or email.
      Contacts__PatientChannel: ${PATIENT_CONTACT_CHANNEL:-sms}
      Scenarios__Directory: /app/scenarios
      Scenarios__RealSecondsPerScenarioHour: "2"
    ports:
      - "${HIS_SIMULATOR_PORT:-5081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # The messaging simulator: text messages and emails to patients, caregivers and staff.
  messaging-simulator:
    build:
      context: .
      dockerfile: src/simulators/messaging/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Delivery reports and replies go to {CallbackBaseUrl}/sms or /email.
      CareLoop__CallbackBaseUrl: http://api:8080/notifications/inbound
      # Signs every callback; must equal the API's Notifications__Sms__InboundSecret and Notifications__Email__InboundSecret above.
      CareLoop__InboundSecret: ${SIMULATOR_INBOUND_SECRET:-}
      Scenarios__Directory: /app/scenarios
      Scenarios__RealSecondsPerScenarioHour: "2"
    ports:
      - "${PATIENT_CHANNEL_SIMULATOR_PORT:-5082}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  careloop-db:
