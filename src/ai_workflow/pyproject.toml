[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "careloop-ai-workflow"
version = "0.2.0"
description = "Stateless, purpose-specific AI drafting service for CareLoop"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "azure-ai-projects>=2.11.0,<3",
  "azure-identity>=1.19,<2",
  "fastapi>=0.115,<1",
  "openai>=3,<4",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["careloop_ai_workflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
