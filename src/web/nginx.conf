server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard calls the CareLoop API on its own origin; forward /api/ to the api service.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        # An AI handoff draft can take longer than nginx's 60 second default.
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
