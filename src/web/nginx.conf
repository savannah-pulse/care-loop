server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard calls the CareLoop API on its own origin; forward /api/ to the api service.
    location /api/ {
        proxy_pass http://api:8080/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
