name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CareLoop.sln
      - run: dotnet build CareLoop.sln --configuration Release --no-restore
      - run: dotnet test CareLoop.sln --configuration Release --no-build

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
        working-directory: src/web
      - run: npm run lint
        working-directory: src/web
      - run: npm run build
        working-directory: src/web

  ai-workflow:
    name: Python workflow lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ai_workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/ai_workflow/pyproject.toml
      - run: python -m pip install --editable ".[dev]"
      - run: ruff check .
      - run: pytest
