name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: dotnet restore CareLoop.sln
      - run: dotnet publish src/api/CareLoop.Api/CareLoop.Api.csproj --configuration Release --no-restore --output artifacts/api
      - run: npm ci
        working-directory: src/web
      - run: npm run build
        working-directory: src/web
      - run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir ../../artifacts
        working-directory: src/ai_workflow
      - name: Package release
        run: |
          mkdir -p artifacts
          cp -R src/web/dist artifacts/web
          cp LICENSE README.md artifacts/
          cd artifacts
          zip -r "../care-loop-${GITHUB_REF_NAME}.zip" api web careloop_ai_workflow-*.whl LICENSE README.md
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "care-loop-${GITHUB_REF_NAME}.zip" --generate-notes
